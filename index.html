<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL Technologies - Support & Legal</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --secondary-text: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: var(--secondary-text);
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-card:hover {
            transform: scale(1.02);
            background-color: #f9f9f9;
        }

        .link-card span {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon {
            font-size: 24px;
            width: 32px;
            text-align: center;
        }

        .chevron {
            color: #c7c7cc;
            font-size: 20px;
        }

        footer {
            margin-top: 60px;
            font-size: 13px;
            color: var(--secondary-text);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">📱</div>
    <h1>GL Technologies</h1>
    <p>Support and Legal Documentation</p>

    <div class="links">
        <a href="faq.html" class="link-card">
            <span>
                <span class="icon">❓</span>
                Support Center / FAQ
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="terms.html" class="link-card">
            <span>
                <span class="icon">📄</span>
                Terms of Service
            </span>
            <span class="chevron">›</span>
        </a>
    </div>

    <footer>
        © 2025 GL Technologies. All rights reserved.
    </footer>
</div>

</body>
</html>
