<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillPilot - Legal & Support</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --secondary-text: #8e8e93;
            --border-color: #e5e5ea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #0A84FF;
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-color: #f2f2f7;
                --secondary-text: #8e8e93;
                --border-color: #38383a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            color: var(--secondary-text);
            margin-bottom: 32px;
            font-size: 15px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 18px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-card:hover {
            transform: scale(1.02);
            background-color: rgba(0, 122, 255, 0.04);
        }

        .link-card span {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon {
            font-size: 22px;
            width: 28px;
            text-align: center;
        }

        .chevron {
            color: #c7c7cc;
            font-size: 20px;
        }

        footer {
            margin-top: 50px;
            font-size: 13px;
            color: var(--secondary-text);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--primary-color);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">💊</div>
    <h1>PillPilot</h1>
    <p>Smart Medication Reminders & Health Tracker<br>Legal & Support Documentation</p>

    <div class="links">
        <a href="privacy.html" class="link-card">
            <span>
                <span class="icon">🔒</span>
                Privacy Policy
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="terms.html" class="link-card">
            <span>
                <span class="icon">📄</span>
                Terms of Use
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="faq.html" class="link-card">
            <span>
                <span class="icon">❓</span>
                Support Center & FAQ
            </span>
            <span class="chevron">›</span>
        </a>
    </div>

    <div>
        <a href="../index.html" class="back-link">← GL Technologies Home</a>
    </div>

    <footer>
        &copy; 2026 GL Technologies. All rights reserved.
    </footer>
</div>

</body>
</html>
