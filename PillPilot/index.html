<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Pill Reminder - Legal & Support</title>
    <style>

        :root {
            --primary-color: #007AFF;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --secondary-text: #6c6c70;
            --border-color: #e5e5ea;
            --notice-bg: #f0f7ff;
            --notice-border: #b3d7ff;
            --notice-text: #004085;
            --warning-bg: #fff8e6;
            --warning-border: #ffd666;
            --warning-text: #874d00;
            --accent-bg: #f8f9ff;
            --subcard-bg: #f9f9fb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #0A84FF;
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-color: #f2f2f7;
                --secondary-text: #8e8e93;
                --border-color: #2c2c2e;
                --notice-bg: #001f3f;
                --notice-border: #004085;
                --notice-text: #b3d7ff;
                --warning-bg: #2b2100;
                --warning-border: #594400;
                --warning-text: #ffc53d;
                --accent-bg: #141b2d;
                --subcard-bg: #242426;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px 12px;
            -webkit-font-smoothing: antialiased;
            word-wrap: break-word;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 36px 28px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            font-size: 14px;
            align-items: center;
        }

        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            min-height: 32px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .lang-picker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-color);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            min-height: 36px;
        }

        .lang-picker select {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        h1 {
            font-size: 25px;
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
            line-height: 1.3;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 12px;
            color: var(--text-color);
            line-height: 1.35;
        }

        h3 {
            font-size: 15px;
            font-weight: 600;
            margin-top: 18px;
            margin-bottom: 8px;
            color: var(--primary-color);
            line-height: 1.35;
        }

        p {
            margin-bottom: 14px;
            font-size: 15px;
            color: var(--text-color);
        }

        ul, ol {
            margin-bottom: 16px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
            font-size: 14.5px;
            line-height: 1.55;
        }

        .meta-info {
            font-size: 13.5px;
            color: var(--secondary-text);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            background-color: rgba(0, 122, 255, 0.1);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .notice-box {
            background-color: var(--notice-bg);
            border: 1px solid var(--notice-border);
            color: var(--notice-text);
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.55;
        }

        .warning-box {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            padding: 18px;
            border-radius: 12px;
            margin: 22px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .warning-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-section {
            background: var(--subcard-bg);
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            border-radius: 12px;
            margin: 16px 0 24px 0;
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--secondary-text);
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 22px;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Mobile specific styling for small screens */
        @media (max-width: 600px) {
            body {
                padding: 12px 8px;
            }
            .container {
                padding: 20px 16px;
                border-radius: 14px;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding-bottom: 12px;
            }
            .nav-links {
                justify-content: flex-start;
                gap: 10px 14px;
                font-size: 13px;
            }
            .lang-picker {
                align-self: flex-start;
                width: 100%;
                justify-content: space-between;
                padding: 8px 12px;
            }
            .lang-picker select {
                width: 100%;
                font-size: 13px;
            }
            h1 {
                font-size: 21px;
                padding-bottom: 10px;
                margin-bottom: 14px;
            }
            h2 {
                font-size: 16.5px;
                margin-top: 24px;
            }
            h3 {
                font-size: 14.5px;
            }
            p, li {
                font-size: 14px;
            }
            .notice-box, .warning-box {
                padding: 14px 12px;
                border-radius: 10px;
                font-size: 13.5px;
            }
            .ai-section {
                padding: 14px 12px;
                border-radius: 10px;
            }
        }

        .portal-container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 30px 20px;
        }

        .top-bar-portal {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 56px;
            margin-bottom: 12px;
        }

        h1.portal-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            border-bottom: none;
            padding-bottom: 0;
        }

        p.portal-subtitle {
            color: var(--secondary-text);
            margin-bottom: 26px;
            font-size: 14.5px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 16px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, background-color 0.2s;
            min-height: 54px;
        }

        .link-card:hover {
            transform: scale(1.015);
            background-color: rgba(0, 122, 255, 0.04);
        }

        .link-card span {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            font-size: 20px;
            width: 26px;
            text-align: center;
        }

        .chevron {
            color: #c7c7cc;
            font-size: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: var(--primary-color);
            text-decoration: none;
            padding: 6px 12px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

<div class="container portal-container">
    <div class="top-bar-portal">
        
        <div class="lang-picker">
            <span>🌐</span>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en" selected>English (Default)</option>
                <option value="zh-Hans">简体中文</option>
                <option value="zh-Hant">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
            </select>
        </div>
    
    </div>

    <div class="logo">💊</div>
    <h1 class="portal-title" id="title">Pill Reminder</h1>
    <p class="portal-subtitle" id="subtitle">Smart Medication Reminders & Health Tracker<br>Legal & Support Documentation</p>

    <div class="links">
        <a href="privacy.html" class="link-card">
            <span>
                <span class="icon">🔒</span>
                <span id="privacy">Privacy Policy</span>
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="terms.html" class="link-card">
            <span>
                <span class="icon">📄</span>
                <span id="terms">Terms of Use</span>
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="faq.html" class="link-card">
            <span>
                <span class="icon">❓</span>
                <span id="faq">Support Center & FAQ</span>
            </span>
            <span class="chevron">›</span>
        </a>
    </div>

    <div>
        <a href="../index.html" class="back-link" id="back">← GL Technologies Home</a>
    </div>

    <footer class="footer" id="footer" style="margin-top: 30px;">
        &copy; 2026 GL Technologies. All rights reserved.
    </footer>
</div>

<script>
    const i18n = {"en": {"title": "Pill Reminder", "subtitle": "Smart Medication Reminders & Health Tracker<br>Legal & Support Documentation", "privacy": "Privacy Policy", "terms": "Terms of Use", "faq": "Support Center & FAQ", "back": "← GL Technologies Home", "footer": "&copy; 2026 GL Technologies. All rights reserved."}, "zh-Hans": {"title": "Pill Reminder", "subtitle": "智能服药提醒与健康管理助手<br>法律协议与支持文档中心", "privacy": "隐私政策", "terms": "服务条款与用户协议", "faq": "支持中心与常见问题", "back": "← 返回 GL Technologies 首页", "footer": "&copy; 2026 GL Technologies. 保留所有权利。"}, "zh-Hant": {"title": "Pill Reminder", "subtitle": "智慧服藥提醒與健康管理助手<br>法律協議與支援文件中心", "privacy": "隱私權政策", "terms": "服務條款與使用者協議", "faq": "支援中心與常見問題", "back": "← 返回 GL Technologies 首頁", "footer": "&copy; 2026 GL Technologies. 版權所有。"}, "ja": {"title": "Pill Reminder", "subtitle": "スマート服薬リマインダー＆健康管理<br>利用規約・プライバシー・サポート窓口", "privacy": "プライバシーポリシー", "terms": "利用規約", "faq": "サポート＆FAQ", "back": "← GL Technologies ホームへ", "footer": "&copy; 2026 GL Technologies. All rights reserved."}, "es": {"title": "Pill Reminder", "subtitle": "Recordatorio Inteligente de Medicamentos<br>Documentación Legal y de Soporte", "privacy": "Política de Privacidad", "terms": "Términos de Uso", "faq": "Centro de Ayuda y FAQ", "back": "← Inicio de GL Technologies", "footer": "&copy; 2026 GL Technologies. Todos los derechos reservados."}, "de": {"title": "Pill Reminder", "subtitle": "Intelligente Medikamentenerinnerung<br>Rechtliche Dokumentation & Hilfe-Center", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "faq": "Support & FAQ", "back": "← GL Technologies Startseite", "footer": "&copy; 2026 GL Technologies. Alle Rechte vorbehalten."}, "fr": {"title": "Pill Reminder", "subtitle": "Rappel Intelligent de Médicaments<br>Documentation Juridique et Support", "privacy": "Politique de Confidentialité", "terms": "Conditions d'Utilisation", "faq": "Centre d'Aide & FAQ", "back": "← Accueil GL Technologies", "footer": "&copy; 2026 GL Technologies. Tous droits réservés."}};

    function getInitialLanguage() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const paramLang = urlParams.get('lang');
            if (paramLang && i18n[paramLang]) return paramLang;

            const saved = localStorage.getItem('pill_reminder_lang');
            if (saved && i18n[saved]) return saved;

            const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            if (browserLang.startsWith('zh-tw') || browserLang.startsWith('zh-hk') || browserLang.startsWith('zh-hant') || browserLang.startsWith('zh-mo')) return 'zh-Hant';
            if (browserLang.startsWith('zh')) return 'zh-Hans';
            if (browserLang.startsWith('ja')) return 'ja';
            if (browserLang.startsWith('es')) return 'es';
            if (browserLang.startsWith('de')) return 'de';
            if (browserLang.startsWith('fr')) return 'fr';
        } catch (e) {}
        return 'en';
    }

    function changeLanguage(lang) {
        if (!i18n[lang]) lang = 'en';
        try {
            localStorage.setItem('pill_reminder_lang', lang);
        } catch (e) {}
        
        const select = document.getElementById('langSelect');
        if (select) select.value = lang;
        document.documentElement.lang = lang;

        const data = i18n[lang];
        for (const [key, val] of Object.entries(data)) {
            const el = document.getElementById(key);
            if (el) el.innerHTML = val;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const lang = getInitialLanguage();
        if (lang !== 'en') {
            changeLanguage(lang);
        }
    });
</script>
</body>
</html>
