<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PillPilot - Legal & Support</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --secondary-text: #8e8e93;
            --border-color: #e5e5ea;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #0A84FF;
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-color: #f2f2f7;
                --secondary-text: #8e8e93;
                --border-color: #38383a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 30px 20px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .lang-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            padding: 5px 12px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
        }

        .lang-picker select {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--secondary-text);
            margin-bottom: 28px;
            font-size: 15px;
            line-height: 1.5;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 18px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-card:hover {
            transform: scale(1.02);
            background-color: rgba(0, 122, 255, 0.04);
        }

        .link-card span {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon {
            font-size: 22px;
            width: 28px;
            text-align: center;
        }

        .chevron {
            color: #c7c7cc;
            font-size: 20px;
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--secondary-text);
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: var(--primary-color);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        
        <div class="lang-picker">
            <span>🌐</span>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">English (US)</option>
                <option value="zh-Hans">简体中文</option>
                <option value="zh-Hant">繁體中文</option>
                <option value="ja">日本語</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="fr">Français</option>
            </select>
        </div>
    
    </div>

    <div class="logo">💊</div>
    <h1 id="title">PillPilot</h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="links">
        <a href="privacy.html" class="link-card">
            <span>
                <span class="icon">🔒</span>
                <span id="privacy"></span>
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="terms.html" class="link-card">
            <span>
                <span class="icon">📄</span>
                <span id="terms"></span>
            </span>
            <span class="chevron">›</span>
        </a>
        <a href="faq.html" class="link-card">
            <span>
                <span class="icon">❓</span>
                <span id="faq"></span>
            </span>
            <span class="chevron">›</span>
        </a>
    </div>

    <div>
        <a href="../index.html" class="back-link" id="back"></a>
    </div>

    <footer id="footer">
        &copy; 2026 GL Technologies. All rights reserved.
    </footer>
</div>

<script>
    const i18n = {"en": {"title": "PillPilot", "subtitle": "Smart Medication Reminders & Health Tracker<br>Legal & Support Documentation", "privacy": "Privacy Policy", "terms": "Terms of Use", "faq": "Support Center & FAQ", "back": "← GL Technologies Home", "footer": "&copy; 2026 GL Technologies. All rights reserved."}, "zh-Hans": {"title": "PillPilot", "subtitle": "智能用药提醒与健康管理助手<br>法律协议与支持文档中心", "privacy": "隐私政策", "terms": "服务条款与用户协议", "faq": "支持中心与常见问题", "back": "← 返回 GL Technologies 首页", "footer": "&copy; 2026 GL Technologies. 保留所有权利。"}, "zh-Hant": {"title": "PillPilot", "subtitle": "智慧用藥提醒與健康管理助手<br>法律協議與支援文件中心", "privacy": "隱私權政策", "terms": "服務條款與使用者協議", "faq": "支援中心與常見問題", "back": "← 返回 GL Technologies 首頁", "footer": "&copy; 2026 GL Technologies. 版權所有。"}, "ja": {"title": "PillPilot", "subtitle": "スマート服薬リマインダー＆健康管理<br>利用規約・プライバシー・サポート窓口", "privacy": "プライバシーポリシー", "terms": "利用規約", "faq": "サポート＆FAQ", "back": "← GL Technologies ホームへ", "footer": "&copy; 2026 GL Technologies. All rights reserved."}, "es": {"title": "PillPilot", "subtitle": "Recordatorio Inteligente de Medicamentos<br>Documentación Legal y de Soporte", "privacy": "Política de Privacidad", "terms": "Términos de Uso", "faq": "Centro de Ayuda y FAQ", "back": "← Inicio de GL Technologies", "footer": "&copy; 2026 GL Technologies. Todos los derechos reservados."}, "de": {"title": "PillPilot", "subtitle": "Intelligente Medikamentenerinnerung<br>Rechtliche Dokumentation & Hilfe-Center", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "faq": "Support & FAQ", "back": "← GL Technologies Startseite", "footer": "&copy; 2026 GL Technologies. Alle Rechte vorbehalten."}, "fr": {"title": "PillPilot", "subtitle": "Rappel Intelligent de Médicaments<br>Documentation Juridique et Support", "privacy": "Politique de Confidentialité", "terms": "Conditions d'Utilisation", "faq": "Centre d'Aide & FAQ", "back": "← Accueil GL Technologies", "footer": "&copy; 2026 GL Technologies. Tous droits réservés."}};

    function getInitialLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const paramLang = urlParams.get('lang');
        if (paramLang && i18n[paramLang]) return paramLang;

        const saved = localStorage.getItem('pillpilot_lang');
        if (saved && i18n[saved]) return saved;

        const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        if (browserLang.startsWith('zh-tw') || browserLang.startsWith('zh-hk') || browserLang.startsWith('zh-hant')) return 'zh-Hant';
        if (browserLang.startsWith('zh')) return 'zh-Hans';
        if (browserLang.startsWith('ja')) return 'ja';
        if (browserLang.startsWith('es')) return 'es';
        if (browserLang.startsWith('de')) return 'de';
        if (browserLang.startsWith('fr')) return 'fr';
        return 'en';
    }

    function changeLanguage(lang) {
        if (!i18n[lang]) lang = 'en';
        localStorage.setItem('pillpilot_lang', lang);
        document.getElementById('langSelect').value = lang;
        document.documentElement.lang = lang;

        const data = i18n[lang];
        for (const [key, val] of Object.entries(data)) {
            const el = document.getElementById(key);
            if (el) el.innerHTML = val;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const lang = getInitialLanguage();
        changeLanguage(lang);
    });
</script>
</body>
</html>
